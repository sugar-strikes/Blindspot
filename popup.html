    <div class="header">
        <h1>Blindspot</h1>
        <p>Focus on the video, not the clock.</p>
    </div>

    <div class="settings">

        <label class="setting">
            <div class="setting-text">
                <strong>Hide Progress Bar</strong>
                <span>Remove the video timeline.</span>
            </div>

            <input type="checkbox" id="progressToggle">
        </label>

        <label class="setting">
            <div class="setting-text">
                <strong>Hide Timestamp</strong>
                <span>Hide the video's time display.</span>
            </div>

            <input type="checkbox" id="timestampToggle">
        </label>
